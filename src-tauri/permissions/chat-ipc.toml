# App-level ACL for the commands the embedded Google Chat page may call.
#
# This file is NOT optional. Tauri resolves our own #[tauri::command]s through
# the ACL, so a bare command is rejected when invoked from a remote origin such
# as https://mail.google.com -- every invoke() would fail. The capability in
# capabilities/remote-chat.json references this permission by its bare
# identifier (app permissions are not namespaced).
#
# Keep this list minimal: anything here is callable by a page we do not control.
# `clipboard_content` and `dropped_file` are the two commands that hand over
# file contents; see `features::clipboard` and `features::dnd` for what bounds
# them.

[[permission]]
identifier = "chat-ipc"
description = "Commands the embedded Google Chat page is allowed to call."
commands.allow = [
  "page_log",
  "set_unread_count",
  "open_external_url",
  "show_notification",
  "menu_action",
  "clipboard_content",
  "dropped_file",
]
